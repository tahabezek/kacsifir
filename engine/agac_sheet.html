<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#ECE5D5}canvas{display:block}</style>
</head><body><canvas id="c" width="1800" height="1000"></canvas>
<script type="module">
// Öğe kâğıdı: üç ağaç türü (tohumlu biçimler, tam ve düşük detay), kütükler, üstten taçlar (sayılmış işaretli), uydu, insan
import { drawTree, drawStump, drawCanopy, drawSatellite, drawPerson } from './agac_chars.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#ECE5D5'; ctx.fillRect(0, 0, 1800, 1000);
const at = (x, y, f) => { ctx.save(); ctx.translate(x, y); f(); ctx.restore(); };
const kinds = ['pine', 'oak', 'cypress'];
for (let i = 0; i < 9; i++) at(90 + i * 120, 330, () => drawTree(ctx, kinds[i % 3], 260 - (i % 3) * 20, i + 1));
for (let i = 0; i < 24; i++) at(1180 + (i % 12) * 48, 200 + Math.floor(i / 12) * 110, () => drawTree(ctx, kinds[i % 3], 70, i + 3, 0.3));
for (let i = 0; i < 5; i++) at(110 + i * 90, 520, () => drawStump(ctx, 60, i));
for (let i = 0; i < 8; i++) at(620 + i * 95, 470, () => drawCanopy(ctx, 84, i, i % 2));
at(1450, 520, () => drawSatellite(ctx, 70));
at(1700, 560, () => drawPerson(ctx, 150));
for (let i = 0; i < 40; i++) at(100 + (i % 20) * 24, 760 + Math.floor(i / 20) * 60, () => drawTree(ctx, kinds[i % 3], 44, i, 0));
for (let i = 0; i < 12; i++) at(650 + i * 16, 900, () => drawStump(ctx, 14, i));
window.__ready = true;
</script></body></html>
