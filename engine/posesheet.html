<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#ECE5D5}</style></head><body><canvas id="c" width="1600" height="900"></canvas>
<script type="module">
import { ANT_CARD, drawAnt } from './creatures.js';
await document.fonts.load('500 22px "IBM Plex Mono"');
const c = document.getElementById('c'), ctx = c.getContext('2d');
ctx.fillStyle = '#ECE5D5'; ctx.fillRect(0, 0, 1600, 900);
ctx.font = '500 22px "IBM Plex Mono"'; ctx.fillStyle = '#8B8577';
ctx.fillText('KARINCA · poz kâğıdı · yürüme döngüsü 8 kare (faz 0 → 7/8)', 30, 40);
for (let k = 0; k < 8; k++) {
  ctx.save(); ctx.translate(110 + k * 190, 190); ctx.rotate(-Math.PI / 2);
  drawAnt(ctx, ANT_CARD, { phase: k / 8 }, 170); ctx.restore();
  ctx.fillText(`${k}/8`, 90 + k * 190, 330);
}
ctx.fillText('boyutlar: 420 · 120 · 40 · 16 · 8 · 4 px', 30, 400);
const sizes = [420, 120, 40, 16, 8, 4]; let x = 260;
ctx.save(); ctx.translate(250, 640); drawAnt(ctx, ANT_CARD, { phase: 0.2 }, 420); ctx.restore();
x = 560;
for (const s of sizes.slice(1)) { ctx.save(); ctx.translate(x, 640); ctx.rotate(0.6); drawAnt(ctx, ANT_CARD, { phase: 0.3 }, s); ctx.restore(); x += s + 90; }
ctx.fillText('baş = 1 birim · toplam 4,65 · 5 mm', 30, 870);
window.__ready = true;
</script></body></html>
