<script type="module">
// Uzun video sahnesi (16:9): Hangisi filmleri ortada dikey sayfa olarak oynar, yanlarda A/B etiketleri;
// aralarda "düello defteri" listesi. Her kare t'nin saf fonksiyonudur; zamanlar plan.json'dan gelir.
import { makeUzunRenderer } from './uzun.js';
const q = new URLSearchParams(location.search);
const plan = await (await fetch('../' + q.get('plan'))).json();
await Promise.all([
  document.fonts.load('800 100px Archivo'), document.fonts.load('600 44px Archivo'),
  document.fonts.load('500 44px "IBM Plex Mono"'), document.fonts.load('500 40px "IBM Plex Mono"', '№ı'),
  document.fonts.load('800 100px Archivo', 'ıİşŞğĞçÇöÖüÜâ'), document.fonts.load('600 44px Archivo', 'ıİşŞğĞçÇöÖüÜ'),
]);
await document.fonts.ready;
const canvas = document.getElementById('c');
if (q.get('thumb')) { canvas.width = 1280; canvas.height = 720; }
const r = await makeUzunRenderer(plan, canvas, { thumb: !!q.get('thumb') });
window.DURATION = plan.duration;
window.renderFrame = t => { r.render(t); return true; };
r.render(0);
window.__ready = true;
</script></body></html>
