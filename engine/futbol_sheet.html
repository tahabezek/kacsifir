<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#ECE5D5}canvas{display:block}</style>
</head><body><canvas id="c" width="1800" height="1000"></canvas>
<script type="module">
// Poz kâğıdı: Kaiser (duruş, koşu, sakatlık, telefon, kavga, oturuş), Kazu (koşu, şut, sevinç, yaş), hakem, patron, nesneler
import { KAISER_CARD, KAZU_CARD, REF_CARD, PATRON_CARD, drawPlayer, drawBall, drawGoal, drawCard, drawPaper } from './futbol_chars.js';
await document.fonts.load('800 40px Archivo');
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#ECE5D5'; ctx.fillRect(0, 0, 1800, 1000);
const at = (x, y, f) => { ctx.save(); ctx.translate(x, y); f(); ctx.restore(); };
const K = [{}, { run: 0.1 }, { run: 0.35 }, { thigh: true, arms: 'thigh', mouth: 'open' }, { arms: 'phone', mouth: 'open' }, { arms: 'fists', phase: 0.2, mouth: 'open' }, { sit: true }];
K.forEach((p, i) => at(90 + i * 140, 430, () => drawPlayer(ctx, KAISER_CARD, p, 330)));
const Z = [{ run: 0.2 }, { kick: 0.2 }, { kick: 0.9 }, { arms: 'up', phase: 0.3, mouth: 'open' }, { run: 0.1, age: 0.9 }];
Z.forEach((p, i) => at(90 + i * 150, 940, () => drawPlayer(ctx, KAZU_CARD, p, 330)));
at(1100, 430, () => drawPlayer(ctx, REF_CARD, { arms: 'point', phase: 0.1 }, 330));
at(1260, 430, () => drawPlayer(ctx, PATRON_CARD, { arms: 'down' }, 340));
at(900, 900, () => drawBall(ctx, 60, 0.3));
at(1000, 940, () => drawGoal(ctx, 200));
at(1400, 300, () => drawCard(ctx, 140));
at(1600, 780, () => drawPaper(ctx, 300, "KAISER'E\nAVRUPA'DAN TEKLİF"));
window.__ready = true;
</script></body></html>
