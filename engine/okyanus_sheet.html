<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#ECE5D5}canvas{display:block}</style>
</head><body><canvas id="c" width="1600" height="900"></canvas>
<script type="module">
// Poz kâğıdı: tekne (2 ve 1 kişi, yalpa), römorkör (dik ve ters), Okene, dalgıç (4 faz), eller (3 an)
import { BOAT_CARD, drawBoat, TUG_CARD, drawTug, OKENE_CARD, drawOkene, DIVER_CARD, drawDiver, drawHands } from './okyanus_chars.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#ECE5D5'; ctx.fillRect(0, 0, 1600, 900);
const at = (x, y, f) => { ctx.save(); ctx.translate(x, y); f(); ctx.restore(); };
at(180, 180, () => drawBoat(ctx, BOAT_CARD, { roll: 0, crew: 2 }, 300));
at(520, 180, () => drawBoat(ctx, BOAT_CARD, { roll: 0.12, crew: 1 }, 300));
at(900, 200, () => drawTug(ctx, TUG_CARD, { roll: 0 }, 340));
at(1300, 160, () => drawTug(ctx, TUG_CARD, { roll: Math.PI }, 340));
at(200, 560, () => drawOkene(ctx, OKENE_CARD, { look: 0 }, 260));
at(420, 560, () => drawOkene(ctx, OKENE_CARD, { look: 1, breathe: 1 }, 260));
for (let i = 0; i < 4; i++) at(700 + i * 230, 480, () => drawDiver(ctx, DIVER_CARD, { phase: i / 4 }, 300));
for (let i = 0; i < 3; i++) at(300 + i * 500, 760, () => drawHands(ctx, i / 2, 260));
window.__ready = true;
</script></body></html>
