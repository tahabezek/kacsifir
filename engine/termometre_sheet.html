<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#ECE5D5}canvas{display:block}</style>
</head><body><canvas id="c" width="1800" height="1100"></canvas>
<script type="module">
// Poz kâğıdı: Anna (kayakçı: duruş, kayak, düşme, yüzme, hareketsiz; doktor önlüğü), Sylbaris (duruş, çömelme, el sallama), nesneler
import { ANNA_CARD, DOCTOR_CARD, SYLBARIS_CARD, PERSON_POSES as P, drawPerson, drawCrystal, drawAshCloud, drawThermoIcon } from './termometre_chars.js';
await document.fonts.load('800 40px Archivo'); await document.fonts.load('500 30px "IBM Plex Mono"');
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#ECE5D5'; ctx.fillRect(0, 0, 1800, 1100);
const at = (x, y, f) => { ctx.save(); ctx.translate(x, y); f(); ctx.restore(); };
const lab = (x, y, s) => { ctx.font = '500 24px "IBM Plex Mono"'; ctx.fillStyle = '#8B8577'; ctx.textAlign = 'center'; ctx.fillText(s, x, y); };
const A = ['stand', 'ski', 'fall', 'float', 'still'];
A.forEach((k, i) => { at(110 + i * 180, 440, () => drawPerson(ctx, ANNA_CARD, P[k], 330)); lab(110 + i * 180, 480, k); });
at(1030, 440, () => { ctx.scale(-1, 1); drawPerson(ctx, ANNA_CARD, P.stand, 330); }); lab(1030, 480, 'yandan (sola)');
at(1200, 440, () => drawPerson(ctx, DOCTOR_CARD, P.stand, 330)); lab(1200, 480, 'doktor');
at(1360, 440, () => drawPerson(ctx, DOCTOR_CARD, P.point, 330)); lab(1360, 480, 'doktor · gösterir');
const S = ['stand', 'crouch', 'wave', 'point'];
S.forEach((k, i) => { at(110 + i * 180, 960, () => drawPerson(ctx, SYLBARIS_CARD, P[k], 330)); lab(110 + i * 180, 1000, k); });
at(830, 820, () => drawCrystal(ctx, 90)); lab(830, 900, 'buz kristali');
at(1100, 820, () => drawAshCloud(ctx, 320, 0.2, 3)); lab(1100, 960, 'kül bulutu');
at(1450, 820, () => drawThermoIcon(ctx, 220, 0.4)); lab(1450, 980, 'termometre');
window.__ready = true;
</script></body></html>
