<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#ECE5D5}canvas{display:block}</style>
</head><body><canvas id="c" width="1800" height="1200"></canvas>
<script type="module">
// Poz kâğıdı: yandan karınca yürüme döngüsü (8 kare), "0" taşıma pozu, üstten karınca (yürüme), ayakta insan,
// tahterevalli, kuş ve fil simgeleri, araştırma kâğıdı.
import { ANT_CARD, drawAnt, antMouth, drawZeroGlyph, drawAntTop, drawStandingPerson, drawSeesaw, drawBirdIcon, drawElephantIcon, drawPaperSheet } from './karinca_chars.js';
await Promise.all([document.fonts.load('800 100px Archivo'), document.fonts.load('600 44px Archivo'), document.fonts.load('500 24px "IBM Plex Mono"')]);
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#ECE5D5'; ctx.fillRect(0, 0, 1800, 1200);
const at = (x, y, f) => { ctx.save(); ctx.translate(x, y); f(); ctx.restore(); };
ctx.font = '500 24px "IBM Plex Mono"'; ctx.fillStyle = '#1C1B18';
ctx.fillText('YÜRÜME DÖNGÜSÜ · 8 KARE (üçlü yürüyüş)', 30, 40);
for (let i = 0; i < 8; i++) at(110 + i * 215, 250, () => { drawAnt(ctx, ANT_CARD, { phase: i / 8 * Math.PI * 2 }, 40); ctx.beginPath(); ctx.moveTo(-110, 0); ctx.lineTo(110, 0); ctx.strokeStyle = '#8B8577'; ctx.lineWidth = 1.5; ctx.stroke(); });
ctx.fillStyle = '#1C1B18'; ctx.fillText('YAKIN PLAN · "0" TAŞIMA', 30, 330);
at(330, 760, () => { const s = 90, pose = { phase: 0.7, carry: 1 }; drawAnt(ctx, ANT_CARD, pose, s); const m = antMouth(ANT_CARD, pose); ctx.save(); ctx.translate(m[0] * s + 40, m[1] * s + 60); drawZeroGlyph(ctx, 150); ctx.restore(); ctx.beginPath(); ctx.moveTo(-260, 0); ctx.lineTo(320, 0); ctx.strokeStyle = '#1C1B18'; ctx.lineWidth = 3; ctx.stroke(); });
ctx.fillText('YAKIN PLAN · YÜRÜME', 760, 330);
at(980, 640, () => drawAnt(ctx, ANT_CARD, { phase: 2.1 }, 70));
ctx.fillText('ÜSTTEN · 4 BOY', 1340, 330);
[90, 40, 16, 6].forEach((s, i) => at(1420 + i * 100, 420, () => drawAntTop(ctx, s, i)));
for (let i = 0; i < 6; i++) at(1380 + i * 60, 520, () => drawAntTop(ctx, 34, i * 1.1));
ctx.fillText('İNSAN · TAHTEREVALLİ · SİMGELER · KÂĞIT', 30, 860);
at(120, 1170, () => drawStandingPerson(ctx, 280));
at(560, 1040, () => drawSeesaw(ctx, 300, 0.12, 110));
at(1000, 980, () => drawBirdIcon(ctx, 120, 0.5));
at(1200, 1000, () => drawElephantIcon(ctx, 220));
at(1500, 1000, () => drawPaperSheet(ctx, 120, 3));
at(1660, 1010, () => drawZeroGlyph(ctx, 90));
window.__ready = true;
</script></body></html>
