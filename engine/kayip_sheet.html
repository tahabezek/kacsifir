<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#ECE5D5}canvas{display:block}</style>
</head><body><canvas id="c" width="1800" height="1200"></canvas>
<script type="module">
// Poz kâğıdı: Siffre (ayakta, oturan, telefonla, lamba), Prosperi (koşu 8 kare, yorgun yürüyüş), Tuareg kız, nesneler
import { SIFFRE_CARD, PROSPERI_CARD, GIRL_CARD, drawFigure, drawTent, drawPhone, drawCalendar, drawIcon, drawShrine, drawBat, drawFootprints, drawGoat } from './kayip_chars.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#ECE5D5'; ctx.fillRect(0, 0, 1800, 1200);
const at = (x, y, f) => { ctx.save(); ctx.translate(x, y); f(); ctx.restore(); };
ctx.font = '500 22px "IBM Plex Mono"'; ctx.fillStyle = '#1C1B18';
ctx.fillText('SIFFRE: AYAKTA · OTURAN · TELEFON · LAMBA', 40, 40);
at(120, 360, () => drawFigure(ctx, SIFFRE_CARD, { arms: 'down' }, 280));
at(330, 360, () => drawFigure(ctx, SIFFRE_CARD, { sit: true, arms: 'down' }, 280));
at(540, 360, () => drawFigure(ctx, SIFFRE_CARD, { arms: 'phone' }, 280));
at(720, 360, () => drawFigure(ctx, SIFFRE_CARD, { arms: 'down', lamp: 1 }, 280));
ctx.fillText('PROSPERI: KOŞU 8 KARE', 40, 420);
for (let i = 0; i < 8; i++) at(110 + i * 150, 700, () => drawFigure(ctx, PROSPERI_CARD, { run: i * 0.6 / 8 }, 250));
ctx.fillText('YORGUN YÜRÜYÜŞ · ELİYLE GÖLGE', 1240, 420);
at(1300, 700, () => drawFigure(ctx, PROSPERI_CARD, { walk: 0.2, weary: 1 }, 250));
at(1460, 700, () => drawFigure(ctx, PROSPERI_CARD, { walk: 0.7, weary: 1 }, 250));
at(1620, 700, () => drawFigure(ctx, PROSPERI_CARD, { arms: 'shade' }, 250));
ctx.fillText('KIZ · KEÇİ · TÜRBE · YARASA · ÇADIR · TELEFON · TAKVİM · SİMGELER · İZ', 40, 770);
at(110, 1100, () => drawFigure(ctx, GIRL_CARD, { arms: 'down' }, 200));
at(230, 1100, () => drawGoat(ctx, 110, 0.2));
at(420, 1100, () => drawShrine(ctx, 220));
for (let i = 0; i < 4; i++) at(580 + i * 70, 860 + (i % 2) * 30, () => drawBat(ctx, 60, i / 4));
at(640, 1100, () => drawTent(ctx, 140));
at(840, 1040, () => drawPhone(ctx, 120, 0)); at(990, 1040, () => drawPhone(ctx, 120, 1));
at(1150, 900, () => drawCalendar(ctx, 160, '20', 'AĞUSTOS')); at(1340, 900, () => drawCalendar(ctx, 160, '14', 'EYLÜL', { color: '#E0391C' }));
at(1490, 900, () => drawIcon(ctx, 80, 'clock', 1)); at(1590, 900, () => drawIcon(ctx, 80, 'calendar', 1)); at(1690, 900, () => drawIcon(ctx, 80, 'sun', 1));
at(1460, 1100, () => drawFootprints(ctx, 34, 9, 0.8));
window.__ready = true;
</script></body></html>
