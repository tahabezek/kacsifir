<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#ECE5D5}canvas{display:block;width:1080px;height:1920px}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { makeRenderer } from './tower.js';
const q = new URLSearchParams(location.search);
const ep = await (await fetch('../' + q.get('ep'))).json();
await Promise.all([
  document.fonts.load('800 100px Archivo'), document.fonts.load('600 44px Archivo'),
  document.fonts.load('500 44px "IBM Plex Mono"'), document.fonts.load('500 40px "IBM Plex Mono"', '№ı'),
  document.fonts.load('800 100px Archivo', 'ıİşŞğĞçÇöÖüÜâ'), document.fonts.load('600 44px Archivo', 'ıİşŞğĞçÇöÖüÜ'),
]);
await document.fonts.ready;
const canvas = document.getElementById('c');
const r = ep.template === 'swarm' ? (await import('./swarm.js')).makeSwarmRenderer(ep, canvas)
  : ep.template === 'doc' ? (await import('./doc.js')).makeDocRenderer(ep, canvas)
  : ep.template === 'versus' ? (await import('./versus.js')).makeVersusRenderer(ep, canvas)
  : ep.template === 'doors' ? (await import('./scenes/doors.js')).makeDoorsRenderer(ep, canvas)
  : ep.template === 'tunnel' ? (await import('./scenes/tunnel.js')).makeTunnelRenderer(ep, canvas)
  : ep.template === 'proof' ? (await import('./scenes/proof.js')).makeProofRenderer(ep, canvas)
  : ep.template === 'rope' ? (await import('./scenes/rope.js')).makeRopeRenderer(ep, canvas)
  : ep.template === 'zeros' ? (await import('./scenes/zeros.js')).makeZerosRenderer(ep, canvas)
  : ep.template === 'sun' ? (await import('./scenes/sun.js')).makeSunRenderer(ep, canvas)
  : ep.template === 'depth' ? (await import('./scenes/depth.js')).makeDepthRenderer(ep, canvas)
  : ep.template === 'storm' ? (await import('./scenes/storm.js')).makeStormRenderer(ep, canvas)
  : ep.template === 'spin' ? (await import('./scenes/spin.js')).makeSpinRenderer(ep, canvas)
  : ep.template === 'needle' ? (await import('./scenes/needle.js')).makeNeedleRenderer(ep, canvas)
  : ep.template === 'pulse' ? (await import('./scenes/pulse.js')).makePulseRenderer(ep, canvas)
  : ep.template === 'altitude' ? (await import('./scenes/altitude.js')).makeAltitudeRenderer(ep, canvas)
  : ep.template === 'tiles' ? (await import('./scenes/tiles.js')).makeTilesRenderer(ep, canvas)
  : ep.template === 'light' ? (await import('./scenes/light.js')).makeLightRenderer(ep, canvas)
  : ep.template === 'board' ? (await import('./scenes/board.js')).makeBoardRenderer(ep, canvas)
  : makeRenderer(ep, canvas);
window.DURATION = r.duration;
window.TIMELINE = r.timeline;
window.renderFrame = t => { r.render(t); return true; };
const t0 = Number(q.get('t') ?? 0);
r.render(t0);
window.__ready = true;
</script></body></html>
